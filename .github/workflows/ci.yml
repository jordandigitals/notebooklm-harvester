name: CI

on:
  push:
    branches: [staging, main]
  pull_request:

jobs:
  secret-scan:
    # The repo is public (D-020): any leaked session, cookie or token would be world-readable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.21.2 (checksum verified)
        run: |
          V=8.21.2
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz$" checksums.txt | sed 's/gitleaks_.*$/gitleaks.tar.gz/' | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      - name: Scan full history
        run: ./gitleaks git . --redact --no-banner --exit-code 1
      - name: Scan working tree
        run: ./gitleaks dir . --redact --no-banner --exit-code 1

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (Mac)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest -q

  ui:
    # Browser tests in demo mode (synthetic data, no network beyond the browser download):
    # filter results against an independent oracle, selection and harvest, URL state,
    # keyboard, performance budgets and axe-core accessibility checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies and Chromium
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: UI tests
        env:
          NLH_UI_TESTS: "1"
          NLH_UI_CHANNEL: chromium
          CI: "1"
        run: pytest -q -s tests/ui
