name: CI

on:
  push:
    branches: [staging, main]
  pull_request:

jobs:
  secret-scan:
    # The repo is public (D-020): any leaked session, cookie or token would be world-readable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.21.2 (checksum verified)
        run: |
          V=8.21.2
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz$" checksums.txt | sed 's/gitleaks_.*$/gitleaks.tar.gz/' | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      - name: Scan full history
        run: ./gitleaks git . --redact --no-banner --exit-code 1
      - name: Scan working tree
        run: ./gitleaks dir . --redact --no-banner --exit-code 1

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (Mac)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        env:
          NLH_UI_LAN: "1"  # CI runners never show the Windows firewall prompt
        run: pytest -q

  ui:
    # Browser tests in demo mode (synthetic data, no network beyond the browser download):
    # filter results against an independent oracle, selection and harvest, URL state,
    # keyboard, performance budgets and axe-core accessibility checks.
    # Windows leg added 2026-11-14: Windows-only faults (a full stderr pipe froze the
    # server; /tmp paths) passed on Linux and only showed on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # Chocolatey can report success yet install 0 packages. Verify ffmpeg and ffprobe run;
        # otherwise fall back to the pinned static build the Windows package uses (SHA-256
        # checked, same as packaging/build_windows.ps1); if that fails too, fail loudly.
        run: |
          choco install ffmpeg -y --no-progress
          if ((Get-Command ffmpeg -ErrorAction SilentlyContinue) -and (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            ffmpeg -version | Select-Object -First 1
            exit 0
          }
          Write-Host "::warning::Chocolatey did not provide ffmpeg and ffprobe; using the pinned static build 9.0.2"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip"
          $sha = "60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg-9.0.2-essentials_build.zip"
          $ProgressPreference = "SilentlyContinue"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12  # Windows PowerShell 5.1
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $sha) {
            Write-Host "::error::ffmpeg fallback download failed its SHA-256 check"
            exit 1
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
          $bin = Join-Path $env:RUNNER_TEMP "ffmpeg-9.0.2-essentials_build\bin"
          if (-not ((Test-Path "$bin\ffmpeg.exe") -and (Test-Path "$bin\ffprobe.exe"))) {
            Write-Host "::error::No ffmpeg: Chocolatey installed nothing and the pinned fallback has no ffmpeg.exe and ffprobe.exe"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & "$bin\ffmpeg.exe" -version | Select-Object -First 1
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium (Windows)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: UI tests
        env:
          NLH_UI_TESTS: "1"
          NLH_UI_CHANNEL: chromium
          NLH_UI_LAN: "1"  # phone tests open a real LAN listener; CI runners never prompt
          CI: "1"
        run: pytest -q -s tests/ui
