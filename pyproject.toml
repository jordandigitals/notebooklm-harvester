[project]
name = "notebooklm-harvester"
version = "0.4.9"
description = "Harvest NotebookLM Audio Overviews to MP3 (read-only toward NotebookLM)."
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The manual's builder holds prose and long selectors; line length is not useful there.
"docs/manual/*.py" = ["E501", "UP031"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
